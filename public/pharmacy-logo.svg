<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 44" role="img" aria-label="Logo de la farmacia">
  <defs>
    <linearGradient id="phg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1273b8"/>
      <stop offset="1" stop-color="#0097b2"/>
    </linearGradient>
  </defs>
  <!-- Emblema: cuadrado redondeado con cruz de farmacia -->
  <rect x="1.5" y="1.5" width="41" height="41" rx="11" fill="url(#phg)"/>
  <path d="M22 11.5v21 M11.5 22h21" stroke="#ffffff" stroke-width="5.4" stroke-linecap="round"/>
  <!-- Marca (sustituible) -->
  <text x="54" y="25" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f4c66" letter-spacing="0.5">LOGO</text>
  <text x="55" y="37.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3" fill="#0097b2">FARMACIA</text>
</svg>
