[phases.setup]
nixPkgs = ["nodejs_22", "python3", "gcc", "gnumake", "libreoffice"]

[phases.install]
cmds = [
  "npm install",
  "echo '── Python env ──' && python3 --version && which python3",
  "python3 -m ensurepip --upgrade || true",
  "python3 -m venv .venv && echo 'venv created at .venv' || (echo 'ERROR: python3 -m venv failed' >&2 && exit 1)",
  ".venv/bin/python -m pip install --upgrade pip",
  ".venv/bin/pip install --no-cache-dir 'Pillow>=10.0.0' 'pypdf>=4.0.0' 'pdf2docx>=0.5.8' 'svglib>=1.5.1' 'reportlab>=4.0.0'",
  ".venv/bin/python -c 'import PIL, pypdf, svglib, reportlab; print(\"All Python deps OK:\", PIL.__version__)'"
]
