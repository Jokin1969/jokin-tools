<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jokin's Tools — Personal Utilities Hub</title>
  <link rel="icon" type="image/svg+xml" href="/public/favicon-jk.svg" />
  <link rel="shortcut icon" href="/public/favicon-jk.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/hub.css?v=3" />
</head>
<body>
  <!-- ─── Header ─────────────────────────────────────────────────────────────── -->
  <header class="hub-header">
    <div class="header-inner">
      <div class="logo-block">
        <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Átomo estilizado — paleta azules -->
          <circle cx="24" cy="24" r="4" fill="#00B8D4"/>
          <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#1B6CB0" stroke-width="1.5" fill="none" opacity="0.7"/>
          <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#009B8D" stroke-width="1.5" fill="none" opacity="0.65" transform="rotate(60 24 24)"/>
          <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#0028A5" stroke-width="1.5" fill="none" opacity="0.5" transform="rotate(120 24 24)"/>
        </svg>
        <div class="logo-text">
          <h1 class="logo-title">
            <span class="logo-j">J</span>okin's Tools<span class="logo-k-accent"></span>
          </h1>
          <p class="logo-subtitle">Personal Utilities Hub</p>
        </div>
      </div>
      <div class="header-meta" id="user-bar">
        <a href="/auth/admin" id="admin-link" class="user-link" style="display:none">Usuarios</a>
        <span class="user-email" id="user-email"></span>
        <button class="user-logout" id="logout-btn" type="button">Salir</button>
      </div>
    </div>
  </header>

  <!-- ─── Main ────────────────────────────────────────────────────────────────── -->
  <main class="hub-main">
    <section class="tools-section">
      <h2 class="section-label">Herramientas disponibles</h2>
      <div class="tools-grid" id="tools-grid">
        <!-- Cards rendered by JS based on the logged-in user's permissions -->
      </div>
      <p class="tools-empty" id="tools-empty" style="display:none">
        Tu cuenta todavía no tiene ninguna herramienta asignada. Pide al administrador que te dé acceso.
      </p>
    </section>
  </main>

  <!-- ─── Footer ──────────────────────────────────────────────────────────────── -->
  <footer class="hub-footer">
    <span>Jokin's Tools &nbsp;·&nbsp; v1.0 &nbsp;·&nbsp; <span id="year"></span></span>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/auth/logout', { method: 'POST' });
      location.href = '/auth/login';
    });

    (async function loadHub() {
      let data;
      try {
        const r = await fetch('/auth/api/me', { headers: { 'Accept': 'application/json' } });
        if (r.status === 401) { location.href = '/auth/login?next=/'; return; }
        data = await r.json();
      } catch { return; }

      const { user, apps } = data;
      document.getElementById('user-email').textContent = user.email;
      if (user.role === 'admin') document.getElementById('admin-link').style.display = '';

      const grid = document.getElementById('tools-grid');
      if (!apps.length) {
        document.getElementById('tools-empty').style.display = '';
        return;
      }
      grid.innerHTML = apps.map(a => `
        <a href="${esc(a.path)}" class="tool-card tool-card--active">
          <div class="card-icon-wrap">${a.icon || ''}</div>
          <div class="card-body">
            <h3 class="card-title">${esc(a.name)}</h3>
            <p class="card-desc">${esc(a.desc)}</p>
            <div class="card-tags">${(a.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
          </div>
          <div class="card-arrow">→</div>
        </a>
      `).join('');
    })();
  </script>
</body>
</html>
