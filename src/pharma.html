<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmacia — Jokin's Tools</title>
  <link rel="icon" type="image/svg+xml" href="/public/favicon-jk.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/pharma.css?v=2" />
</head>
<body>
  <header class="ph-header">
    <div class="ph-header-in">
      <button class="ph-logo" id="logo-home" type="button" title="Farmacia — inicio">
        <span class="ph-logo-badge"><img src="/public/pharmacy-logo.svg" alt="Farmacia" /></span>
        <span class="ph-logo-txt">
          <a href="/" class="ph-kicker" title="Ir al Hub principal">Jokin's Tools ›</a>
          <span class="t">Farmacia</span>
          <span class="s">Suite de gestión de medicación</span>
        </span>
      </button>
      <button class="ph-help-btn" id="help-toggle" type="button">❔ <span>Ayuda</span></button>
    </div>
  </header>

  <main class="ph-main">
    <div class="ph-hero">
      <h1 id="hero-title">Aplicaciones de farmacia</h1>
      <p id="hero-sub">Elige una de las tres herramientas. Están conectadas entre sí.</p>
    </div>
    <div class="ph-label" id="label">Herramientas</div>
    <div class="ph-grid" id="grid"></div>
    <p class="ph-empty" id="empty" style="display:none">No tienes acceso a ninguna app de farmacia. Pide acceso al administrador.</p>
  </main>

  <footer class="ph-footer"><span>Jokin's Tools · Farmacia · <a href="/">Hub principal ↑</a></span></footer>

  <script>
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let APPS = [], mode = 'apps';

    const tile = (href, icon, title, desc, tags, isHelp) => `
      <a href="${esc(href)}" class="ph-card${isHelp ? ' is-help' : ''}">
        <span class="ph-card-ico">${icon || ''}</span>
        <span class="ph-card-body">
          <span class="ph-card-title">${esc(title)}</span>
          <span class="ph-card-desc">${esc(desc)}</span>
          <span class="ph-tags">${(tags || []).map(t => `<span class="ph-tag">${esc(t)}</span>`).join('')}</span>
        </span>
        <span class="ph-card-arrow">→</span>
      </a>`;

    function render() {
      const help = mode === 'help';
      document.getElementById('hero-title').textContent = help ? 'Ayuda de farmacia' : 'Aplicaciones de farmacia';
      document.getElementById('hero-sub').textContent = help ? 'Abre el manual de cualquiera de las tres apps.' : 'Elige una de las tres herramientas. Están conectadas entre sí.';
      document.getElementById('label').textContent = help ? 'Manuales' : 'Herramientas';
      document.getElementById('help-toggle').classList.toggle('is-on', help);
      document.getElementById('grid').innerHTML = APPS.map(a => help
        ? tile(a.path + '?help=1', a.icon, 'Ayuda · ' + a.name, 'Abre el manual de ' + a.name + '.', ['Manual'], true)
        : tile(a.path, a.icon, a.name, a.desc, a.tags, false)).join('');
    }

    (async function () {
      let data;
      try {
        const r = await fetch('/auth/api/me', { headers: { Accept: 'application/json' } });
        if (r.status === 401) { location.href = '/auth/login?next=/farmacia'; return; }
        data = await r.json();
      } catch { return; }
      APPS = (data.apps || []).filter(a => a.group === 'farmacia');
      if (!APPS.length) { document.getElementById('label').style.display = 'none'; document.getElementById('empty').style.display = ''; return; }
      render();
      document.getElementById('logo-home').addEventListener('click', e => { if (e.target.closest('.ph-kicker')) return; mode = 'apps'; render(); });
      document.getElementById('help-toggle').addEventListener('click', () => { mode = mode === 'help' ? 'apps' : 'help'; render(); });
    })();
  </script>
</body>
</html>
