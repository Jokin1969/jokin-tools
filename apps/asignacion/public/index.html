<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asignación de medicación · Jokin's Tools</title>
  <link rel="icon" type="image/svg+xml" href="/public/favicon-jk.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/hub-nav.css?v=5" />
  <script src="/src/hub-nav.js?v=3" defer></script>
  <link rel="stylesheet" href="/asignacion/assets/styles.css?v=23" />
</head>
<body>

<nav class="hub-nav" data-app="asignacion">
  <a href="/" class="hub-nav-brand" title="Jokin's Tools Hub">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="24" cy="24" r="4" fill="#00B8D4"/>
      <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#1B6CB0" stroke-width="1.5" fill="none" opacity="0.7"/>
      <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#009B8D" stroke-width="1.5" fill="none" opacity="0.65" transform="rotate(60 24 24)"/>
      <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#0028A5" stroke-width="1.5" fill="none" opacity="0.5" transform="rotate(120 24 24)"/>
    </svg>
    <span class="hub-nav-brand-name"><span class="jn-accent">J</span>okin's Tools</span>
  </a>
  <div class="hub-nav-links">
    <a href="/" class="hub-nav-link" data-app="hub">Hub</a>
    <a href="/qr-tis" class="hub-nav-link" data-app="qr-tis">QR (TIS)</a>
    <a href="/datamatrix" class="hub-nav-link" data-app="datamatrix">Data Matrix</a>
    <a href="/asignacion" class="hub-nav-link" data-app="asignacion">Asignación</a>
  </div>
</nav>

<header class="qt-header">
  <div class="qt-header-in">
    <a class="qt-pharma-logo" href="/farmacia" title="Farmacia — mini-hub"><img src="/public/pharmacy-logo.svg" alt="Logo de la farmacia" /></a>
    <a href="/asignacion" class="qt-logo" id="go-home">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="22" cy="20" r="8" stroke="currentColor" stroke-width="2.4"/>
        <path d="M8 50c0-8 6-13 14-13s14 5 14 13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <rect x="40" y="30" width="18" height="18" rx="3" stroke="currentColor" stroke-width="2.4"/>
        <path d="M45 39h8M49 35v8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <div class="qt-logo-txt">
        <span class="t">Asignación de medicación</span>
        <span class="s">Persona (TIS) + cajas (Data Matrix)</span>
      </div>
    </a>
    <nav class="pharma-switch" aria-label="Ir a otra app de farmacia">
      <a href="/qr-tis" class="pharma-link" data-app="qr-tis"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/><path d="M14 15h3v-1M20 14v3h-3M14 20h2m3-1v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="pl">QR (TIS)</span></a>
      <a href="/datamatrix" class="pharma-link" data-app="datamatrix"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 4v16M5 20h15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="9" y="5" width="3" height="3" fill="currentColor"/><rect x="15" y="5" width="3" height="3" fill="currentColor"/><rect x="9" y="11" width="3" height="3" fill="currentColor"/><rect x="16" y="12" width="2.6" height="2.6" fill="currentColor"/></svg><span class="pl">Data Matrix</span></a>
      <a href="/asignacion" class="pharma-link is-current" aria-current="page" data-app="asignacion"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="2"/><path d="M3.6 20c0-3 2.4-5 5.4-5s5.4 2 5.4 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="15.4" y="12.4" width="6" height="6" rx="1.4" stroke="currentColor" stroke-width="2"/></svg><span class="pl">Asignación</span></a>
    </nav>
    <button class="qt-cart-btn az-bell" id="bell-btn" title="Avisos de liberación (buscar por fecha)">🔔 <span class="qt-cart-count az-bell-count" id="bell-count" hidden>0</span></button>
    <button class="qt-cart-btn az-notif-btn" id="notif-btn" title="Notificaciones por email (programadas)">✉️</button>
    <button class="qt-cart-btn az-notes-btn" id="notes-btn" title="Tablón de notas (post-its)">🗒️ <span class="qt-cart-count az-notes-count" id="notes-count" hidden>0</span></button>
    <button class="qt-help-btn" id="help-btn" title="Manual / Ayuda">❔ <span class="qt-help-btn-t">Ayuda</span></button>
    <button class="qt-cart-btn" id="cart-toggle" title="Carrito de personas">🛒 <span class="qt-cart-count" id="cart-count">0</span></button>
  </div>
</header>

<main class="qt-main" id="qt-main"><!-- views injected here --></main>

<aside class="qt-cart" id="cart-panel" aria-hidden="true"></aside>
<div class="qt-scrim" id="scrim" hidden></div>

<!-- Scan modal (camera → ZXing decodes Data Matrix / QR) -->
<div class="qt-modal" id="scan-modal" hidden>
  <div class="qt-modal-box qt-scan-box">
    <div class="qt-modal-h"><h3 id="scan-title">Escanear Data Matrix</h3><button class="qt-x" id="scan-close">×</button></div>
    <div class="qt-scan-video-wrap"><video id="scan-video" playsinline muted></video><div class="qt-scan-frame"></div></div>
    <p class="qt-scan-note" id="scan-note">Apunta la cámara al código Data Matrix de la caja…</p>
    <canvas id="scan-canvas" hidden></canvas>
  </div>
</div>

<!-- Generic tool modal -->
<div class="qt-modal" id="tool-modal" hidden>
  <div class="qt-modal-box qt-tool-box" id="tool-modal-box"></div>
</div>

<!-- Generic confirm modal -->
<div class="qt-modal" id="confirm-modal" hidden>
  <div class="qt-modal-box">
    <div class="qt-modal-h"><h3 id="confirm-title">Confirmar</h3></div>
    <p class="qt-confirm-body" id="confirm-body"></p>
    <div class="qt-modal-actions">
      <button class="qt-btn qt-btn-ghost" id="confirm-no">Cancelar</button>
      <button class="qt-btn qt-btn-danger" id="confirm-yes">Aceptar</button>
    </div>
  </div>
</div>

<div class="qt-toast" id="toast" hidden></div>

<script src="/asignacion/assets/vendor/qrcode.js?v=1"></script>
<script src="/asignacion/assets/vendor/bwip-js.js?v=1"></script>
<script src="/asignacion/assets/vendor/zxing.js?v=1"></script>
<script src="/asignacion/assets/app.js?v=32"></script>
</body>
</html>
