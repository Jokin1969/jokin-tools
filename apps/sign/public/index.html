<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firma Digital · Jokin's Tools</title>
  <link rel="icon" type="image/svg+xml" href="/public/favicon-jk.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/hub-nav.css?v=5" />
  <script src="/src/hub-nav.js?v=3" defer></script>
  <link rel="stylesheet" href="/sign/public/styles.css" />
</head>
<body>

<nav class="hub-nav" data-app="sign">
  <a href="/" class="hub-nav-brand" title="Jokin's Tools Hub">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="24" cy="24" r="4" fill="#00B8D4"/>
      <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#1B6CB0" stroke-width="1.5" fill="none" opacity="0.7"/>
      <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#009B8D" stroke-width="1.5" fill="none" opacity="0.65" transform="rotate(60 24 24)"/>
      <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#0028A5" stroke-width="1.5" fill="none" opacity="0.5" transform="rotate(120 24 24)"/>
    </svg>
    <span class="hub-nav-brand-name"><span class="jn-accent">J</span>okin's Tools</span>
  </a>
  <div class="hub-nav-links">
    <a href="/" class="hub-nav-link" data-app="hub">Hub</a>
  </div>
</nav>

<header class="sign-header">
  <div class="sign-header-in">
    <a href="/sign" class="sign-logo">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 48c8-8 16-16 24-24s12-8 16-4c2 2 0 10-4 16-4 6-12 12-20 16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="52" cy="12" r="3" fill="currentColor"/>
        <path d="M48 16l8-8M42 10l16-16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
      </svg>
      <div class="sign-logo-txt">
        <span class="t">Firma Digital</span>
        <span class="s">Dibuja, copia y descarga</span>
      </div>
    </a>
  </div>
</header>

<main class="sign-main">
  <div class="sign-container">
    <!-- Canvas de firma -->
    <div class="sign-canvas-wrapper">
      <div class="sign-canvas-frame">
        <canvas id="signatureCanvas" width="800" height="400"></canvas>
        <div class="sign-canvas-hint">Dibuja aquí tu firma</div>
      </div>
    </div>

    <!-- Controles -->
    <div class="sign-controls">
      <div class="sign-control-group">
        <button class="sign-btn sign-btn-secondary" id="btn-clear">🗑️ Limpiar</button>
        <button class="sign-btn sign-btn-secondary" id="btn-undo">↶ Deshacer</button>
      </div>

      <div class="sign-control-group">
        <button class="sign-btn sign-btn-primary" id="btn-copy">📋 Copiar al portapapeles</button>
      </div>

      <div class="sign-control-group">
        <button class="sign-btn sign-btn-secondary" id="btn-download-png">⬇️ PNG</button>
        <button class="sign-btn sign-btn-secondary" id="btn-download-pdf">⬇️ PDF</button>
        <button class="sign-btn sign-btn-secondary" id="btn-download-svg">⬇️ SVG</button>
      </div>
    </div>

    <!-- Mensaje de feedback -->
    <div class="sign-feedback" id="feedback" hidden>
      <span id="feedback-text"></span>
    </div>
  </div>
</main>

<script src="/sign/public/app.js"></script>
</body>
</html>
