<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin acceso — Jokin's Tools</title>
  <link rel="icon" type="image/svg+xml" href="/public/favicon-jk.svg" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Source+Serif+4:ital,wght@0,400;0,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/hub.css?v=3" />
  <style>
    .nf-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:60px 20px; text-align:center; }
    .nf-code { font-family:var(--mono); font-size:3rem; font-weight:700; color:var(--blue); }
    .nf-msg { font-family:var(--serif); font-size:1.1rem; color:var(--text); max-width:440px; }
    .nf-sub { font-family:var(--mono); font-size:0.78rem; color:var(--text-muted); }
    .nf-link { font-family:var(--mono); font-size:0.82rem; color:#fff; background:var(--blue); padding:10px 18px; border-radius:var(--radius-sm); text-decoration:none; margin-top:8px; }
    .nf-link:hover { background:var(--accent); }
  </style>
</head>
<body>
  <div class="nf-wrap">
    <div class="nf-code">403</div>
    <p class="nf-msg">No tienes acceso a esta herramienta.</p>
    <p class="nf-sub">Si crees que deberías tenerlo, pide al administrador que te lo asigne.</p>
    <a class="nf-link" href="/">← Volver al hub</a>
  </div>
</body>
</html>
