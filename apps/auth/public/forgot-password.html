<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña — Jokin's Tools</title>
  <link rel="icon" type="image/svg+xml" href="/public/favicon-jk.svg" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/hub.css?v=3" />
  <style>
    .auth-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
    .auth-card { width:100%; max-width:420px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:36px 32px; }
    .auth-logo { display:flex; align-items:center; gap:12px; margin-bottom:6px; }
    .auth-logo svg { width:40px; height:40px; }
    .auth-title { font-family:var(--serif); font-size:1.5rem; font-weight:600; color:var(--text); }
    .auth-title .logo-j { color:var(--klein); }
    .auth-sub { font-family:var(--mono); font-size:0.72rem; color:var(--text-muted); margin-bottom:18px; letter-spacing:.02em; }
    .auth-field { margin-bottom:16px; }
    .auth-field label { display:block; font-family:var(--mono); font-size:0.72rem; color:var(--text-muted); margin-bottom:6px; }
    .auth-input { width:100%; padding:11px 13px; font-size:0.95rem; font-family:var(--serif); border:1px solid var(--border); border-radius:var(--radius-sm); background:#fff; color:var(--text); }
    .auth-input:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(27,108,176,.12); }
    .auth-btn { width:100%; padding:12px; margin-top:4px; font-family:var(--mono); font-size:0.85rem; font-weight:600; color:#fff; background:var(--blue); border:none; border-radius:var(--radius-sm); cursor:pointer; transition:background .15s; }
    .auth-btn:hover { background:var(--accent); }
    .auth-btn:disabled { opacity:.6; cursor:default; }
    .auth-msg { font-family:var(--mono); font-size:0.76rem; margin-top:14px; min-height:1.1em; text-align:center; }
    .auth-msg.err { color:#B3261E; } .auth-msg.ok { color:var(--turquoise); }
    .auth-links { text-align:center; margin-top:16px; }
    .auth-links a { font-family:var(--mono); font-size:0.74rem; color:var(--blue); text-decoration:none; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" id="form" autocomplete="on">
      <div class="auth-logo">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="24" cy="24" r="4" fill="#00B8D4"/>
          <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#1B6CB0" stroke-width="1.5" fill="none" opacity="0.7"/>
          <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#009B8D" stroke-width="1.5" fill="none" opacity="0.65" transform="rotate(60 24 24)"/>
          <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#0028A5" stroke-width="1.5" fill="none" opacity="0.5" transform="rotate(120 24 24)"/>
        </svg>
        <span class="auth-title"><span class="logo-j">J</span>okin's Tools</span>
      </div>
      <p class="auth-sub">Recuperar acceso · te enviaremos un email</p>

      <div class="auth-field">
        <label for="email">Email de tu cuenta</label>
        <input class="auth-input" type="email" id="email" name="email" autocomplete="username" required />
      </div>
      <button class="auth-btn" type="submit" id="submit">Enviar enlace de recuperación</button>
      <div class="auth-msg" id="msg"></div>
      <div class="auth-links"><a href="/auth/login">← Volver a iniciar sesión</a></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = ''; msg.className = 'auth-msg';
      btn.disabled = true; btn.textContent = 'Enviando…';
      try {
        await fetch('/auth/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value }),
        });
      } catch (_) { /* respuesta neutra de todos modos */ }
      msg.textContent = 'Si ese email tiene una cuenta, te hemos enviado instrucciones para restablecer la contraseña. Revisa tu bandeja (y el spam).';
      msg.classList.add('ok');
      btn.textContent = 'Enviado';
    });
  </script>
</body>
</html>
