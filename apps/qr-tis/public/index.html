<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de QR (TIS) · Jokin's Tools</title>
  <link rel="icon" type="image/svg+xml" href="/public/favicon-jk.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/hub-nav.css?v=3" />
  <script src="/src/hub-nav.js?v=1" defer></script>
  <link rel="stylesheet" href="/qr-tis/assets/styles.css?v=6" />
</head>
<body>

<nav class="hub-nav" data-app="qr-tis">
  <a href="/" class="hub-nav-brand" title="Jokin's Tools Hub">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="24" cy="24" r="4" fill="#00B8D4"/>
      <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#1B6CB0" stroke-width="1.5" fill="none" opacity="0.7"/>
      <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#009B8D" stroke-width="1.5" fill="none" opacity="0.65" transform="rotate(60 24 24)"/>
      <ellipse cx="24" cy="24" rx="20" ry="8" stroke="#0028A5" stroke-width="1.5" fill="none" opacity="0.5" transform="rotate(120 24 24)"/>
    </svg>
    <span class="hub-nav-brand-name"><span class="jn-accent">J</span>okin's Tools</span>
  </a>
  <div class="hub-nav-links">
    <a href="/" class="hub-nav-link" data-app="hub">Hub</a>
    <a href="/qr-tis" class="hub-nav-link" data-app="qr-tis">QR (TIS)</a>
  </div>
</nav>

<header class="qt-header">
  <div class="qt-header-in">
    <a href="/qr-tis" class="qt-logo" id="go-home">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="12" y="12" width="16" height="16" rx="2" stroke="currentColor" stroke-width="2.4"/>
        <rect x="17" y="17" width="6" height="6" rx="1" fill="currentColor"/>
        <rect x="36" y="12" width="16" height="16" rx="2" stroke="currentColor" stroke-width="2.4"/>
        <rect x="41" y="17" width="6" height="6" rx="1" fill="currentColor"/>
        <rect x="12" y="36" width="16" height="16" rx="2" stroke="currentColor" stroke-width="2.4"/>
        <rect x="17" y="41" width="6" height="6" rx="1" fill="currentColor"/>
        <path d="M36 36h5v5M52 36v5h-5M36 52h5M47 47v5h5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="qt-logo-txt">
        <span class="t">Gestión de QR</span>
        <span class="s">TIS · gestión de medicación</span>
      </div>
    </a>
    <button class="qt-help-btn" id="help-btn" title="Manual / Ayuda">❔ <span class="qt-help-btn-t">Ayuda</span></button>
    <button class="qt-cart-btn" id="cart-toggle" title="Carrito">
      🛒 <span class="qt-cart-count" id="cart-count">0</span>
    </button>
  </div>
</header>

<main class="qt-main" id="qt-main"><!-- views injected here --></main>

<!-- Cart slide-over -->
<aside class="qt-cart" id="cart-panel" aria-hidden="true"></aside>
<div class="qt-scrim" id="scrim" hidden></div>

<!-- Scan modal -->
<div class="qt-modal" id="scan-modal" hidden>
  <div class="qt-modal-box qt-scan-box">
    <div class="qt-modal-h"><h3>Escanear código QR</h3><button class="qt-x" id="scan-close">×</button></div>
    <div class="qt-scan-video-wrap"><video id="scan-video" playsinline muted></video><div class="qt-scan-frame"></div></div>
    <p class="qt-scan-note" id="scan-note">Apunta la cámara al código QR del TIS…</p>
    <canvas id="scan-canvas" hidden></canvas>
  </div>
</div>

<!-- Generic tool modal (import/template, export Excel/PDF, recientes) -->
<div class="qt-modal" id="tool-modal" hidden>
  <div class="qt-modal-box qt-tool-box" id="tool-modal-box"></div>
</div>

<!-- Generic confirm modal -->
<div class="qt-modal" id="confirm-modal" hidden>
  <div class="qt-modal-box">
    <div class="qt-modal-h"><h3 id="confirm-title">Confirmar</h3></div>
    <p class="qt-confirm-body" id="confirm-body"></p>
    <div class="qt-modal-actions">
      <button class="qt-btn qt-btn-ghost" id="confirm-no">Cancelar</button>
      <button class="qt-btn qt-btn-danger" id="confirm-yes">Aceptar</button>
    </div>
  </div>
</div>

<div class="qt-toast" id="toast" hidden></div>

<script src="/qr-tis/assets/vendor/qrcode.js?v=1"></script>
<script src="/qr-tis/assets/vendor/jsQR.js?v=1"></script>
<script src="/qr-tis/assets/vendor/xlsx.full.min.js?v=1"></script>
<script src="/qr-tis/assets/app.js?v=6"></script>
</body>
</html>
