implementa = ["masking.apply_mask"]
protege = "Que un intervalo murino no se aplique sobre el transcrito humano, donde CABE de sobra y taparía un tramo que ahí no es repetitivo. Se compara lo que el resumen declara haber analizado con lo que se le da."
momento = "CADA_CORRIDA"
puede_degradar = false
degrada_como = "No se degrada."
revalida = "Cada corrida."

# ─────────────── Lo que SÓLO calcula un resumen, y por tanto no es un guardia ───────────────
#
# Aparecen en la clase derivada del código —tocan un md5— pero no COMPARAN nada: lo
# calculan para que otro lo compare, o para sembrar un generador. Se declaran aquí para
# que la clase derivada quede cubierta entera y no haya donde esconder un guardia.

[solo_calculan]
"blast.QueryFasta.md5" = "Calcula el md5 del FASTA de consulta para que `blast_store` lo compare al recibir el resultado. El guardia es aquél."
"genbank.sequence_md5" = "Calcula el md5 del ORIGIN. Quien lo compara es `reference.verify_transcript`."
"reference.sequence_md5" = "El md5 canónico de una secuencia. Lo compara `verify_transcript`."
"spliceai._md5" = "Calcula el md5 de una construcción para que `parse_result` lo compare."
"splicing.IntronlessControl.md5" = "El md5 del control sin intrón, para la hoja de pedido. No compara nada."
"store._line_md5" = "Calcula el eslabón de la cadena. Quien la comprueba es `verify()`."
"presentation.reference_md5s" = "Copia al informe los md5 del manifiesto. Es procedencia que se enseña, no una comprobación."
"gestor._md5" = "El md5 de un fichero del gestor. Lo comparan `biblioteca.guardar` y `biblioteca.leer`."
"spacers.choose_spacers" = "Usa un md5 como SEMILLA del generador de espaciadores, no como identidad: sirve para que la elección sea reproducible."
"presentation.run_fingerprint" = "Calcula la huella del panel y los ajustes. Quien la COMPARA es `cached_run`."

# ─────────────── Comparan una identidad y NO abortan: son INFORMES ───────────────
#
# La distinción es el punto de esta auditoría: **un guardia que no aborta es un aviso, y
# un aviso no protege nada**. Lo que hay aquí compara de verdad, pero devuelve un estado
# para que alguien lo pinte. Sirve para decidir con la pantalla delante; no impide nada.

[solo_informan]
"manifest.check_directory" = "Compara el md5 de cada fichero del directorio contra el manifiesto y devuelve `EntryStatus.NO_COINCIDE`. Es lo que pinta el panel de ficheros — y NO aborta. Quien aborta es el cargador del filtro, en cada corrida."
