[[guardia]]
guardia = "Una ficha con marcadores sin resolver no se renderiza"
implementa = ["obtencion.Ficha.render", "obtencion.resolve_ficha"]
protege = "Que no salga `rmsk_{slug}.out` como si fuera un nombre de fichero. Esos textos se copian."
