implementa = ["tiling.tile_utr"]
protege = "Que «se decidió no usarla» y «nadie se acordó» no den el mismo resultado mudo. `measured_apa=None` ABORTA; para excluirla hay que escribir `ApaExcluded` con motivo."
momento = "CADA_CORRIDA"
puede_degradar = false
degrada_como = "No se degrada: el centinela está en la firma."
revalida = "Cada corrida."

[[guardia]]
