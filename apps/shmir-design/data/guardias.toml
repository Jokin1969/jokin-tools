momento = "AL_CONSTRUIR"
puede_degradar = false
degrada_como = "No se degrada."
revalida = "Cada construcción."

[[guardia]]
guardia = "Los contextos del módulo cuadran con el plásmido depositado"
implementa = ["gblock.verify_contexts_against_plasmid"]
protege = "Que lo que se manda a SINTETIZAR lleve los contextos del vector real. Sin el plásmido sale NOT_RUN, no PASS."
momento = "AL_EMITIR"
puede_degradar = false
degrada_como = "No se degrada: corre en los DOS generadores cada vez que se monta el módulo."
