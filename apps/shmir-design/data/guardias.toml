# Los guardias del proyecto: qué protege cada uno, CUÁNDO corre, y qué lo revalida.
#
# Lo emite y lo comprueba `tools/auditar_guardias.py`, con `tests/test_guardias.py`
# atando la tabla al código en las dos direcciones — igual que `alcanzabilidad.toml` y
# `datos_en_codigo.toml`, y por la misma razón: una lista que se pudre deja de leerse.
#
# POR QUÉ EXISTE. Errata nº 27: `EVIDENCE` llevaba anclada a un fichero retirado, y de
# los dos guardias que podían haberlo cazado uno habría APROBADO y el otro sólo salta
# AL IMPORTAR UN FICHERO. La contramedida existía y estaba en el sitio equivocado del
# flujo; nada la revalidaba después.
#
# `momento` — cuándo corre:
#   INGESTA        al cargar o al subir algo. Protege el instante, no lo que venga luego.
#   CADA_CORRIDA   cada vez que se diseña.
#   AL_EMITIR      al escribir la salida.
#   AL_ABRIR       al recuperar algo guardado.
#   AL_CONSTRUIR   en el `__post_init__`: siempre que el objeto exista.
#
# `como_actua` — cómo impide lo que impide:
#   ABORTA   levanta el error y el paso no se ejecuta. Es el caso normal (regla 2).
#   RECHAZA  no aborta: RETIENE el resultado y dice por qué. Vale donde abortar sería
#            peor — una página que se cae al cambiar un ajuste no protege a nadie— pero
#            se declara, porque «no aborta» a secas es lo que distingue un guardia de un
#            aviso, y un aviso no protege nada.
#
# `puede_degradar` — si lo protegido puede CAMBIAR después de la comprobación.
# `revalida` — qué lo vuelve a comprobar, o `NADA`.
#
# **SUITE ES UNA CATEGORÍA DE PRIMERA, NO UNA NOTA. DECIDIDO 2026-08-27.** Un guardia
# cuyo supuesto sólo comprueba la suite protege el REPOSITORIO y **no protege una
# corrida**: en producción el directorio de referencia y los proyectos viven en volúmenes
# (`SHMIR_REFERENCE_DIR`, `SHMIR_PROJECT_DIR`) que la suite no mira, y el manifiesto de
# trabajo se escribe ahí. Todo lo que se apoye en el CONTENIDO de esos volúmenes y sólo
# lo cruce un test está en esta situación.
#
# Por eso `revalida = "SUITE …"` OBLIGA a rellenar `revalida_en_produccion`, que dice qué
# lo revalidaría de verdad. Sin ese campo la categoría sería una queja; con él es una
# lista de tareas. Lo exige `tests/test_guardias.py`.

# ─────────────── Identidad de los ficheros de referencia ───────────────

[[guardia]]
guardia = "El md5 del FICHERO en disco cuadra con el manifiesto"
implementa = ["deposito.accept_upload"]
protege = "Que el fichero que hay sea el que se registró: ni otra descarga, ni otra versión, ni el mismo nombre con otro contenido."
momento = "INGESTA"
puede_degradar = true
degrada_como = "El directorio de trabajo es un VOLUMEN: alguien puede subir otro fichero con el mismo nombre entre la comprobación y la corrida. Y OJO — `manifest.check_directory`, que es lo que pinta el panel, NO aborta: devuelve `NO_COINCIDE` y lo enseña. Eso es un INFORME, no un guardia, y lo señaló esta misma auditoría al ver una entrada de la que no abortaba ninguna pieza."
revalida = "Los cargadores de `resources.py`, que reciben `expected_md5` del manifiesto y lo vuelven a comprobar EN CADA CORRIDA. Son ellos los que abortan."

[[guardia]]
guardia = "Cada cargador reverifica el md5 del fichero que abre"
implementa = [
  "resources._refseq", "resources._mirbase", "resources._abundancia",
  "resources._transcriptoma", "resources._rmsk", "resources._transgen",
  "resources._apa", "resources._polyadb",
  "mirna.load_mature_fa", "mirna.load_abundance_list", "mirna._read",
  "seed_load.load_utr3_set", "specificity.load_database",
  "apa.load_apa_sites", "apa.load_polyadb", "masking.load_rmsk",
  "masking.parse_rmsk_out",
]
protege = "Lo mismo que el anterior, pero en el momento en que el dato se USA. Es lo que hace que la comprobación de ingesta no sea la única."
momento = "CADA_CORRIDA"
puede_degradar = false
degrada_como = "No se degrada: el md5 se recalcula de los bytes que se acaban de leer."
revalida = "Se revalida a sí mismo en cada corrida."

[[guardia]]
guardia = "El md5 de la SECUENCIA canónica, que no es el del fichero"
implementa = ["reference.verify_transcript", "reference.extract_3utr"]
protege = "Que la secuencia sea la de la referencia. Va sobre la cadena canónica —mayúsculas, sin cabecera, sin saltos—, así que sobrevive a un reformateo del FASTA que cambiaría el md5 del fichero."
momento = "CADA_CORRIDA"
puede_degradar = false
degrada_como = "No se degrada: se recalcula de la secuencia cargada."
revalida = "Se revalida a sí mismo en cada carga."

[[guardia]]
guardia = "El md5 del 3'UTR decide si la tabla de APA medido aplica"
implementa = ["apa.resolve_measured"]
protege = "Que unas coordenadas de un gen no se anclen sobre OTRO 3'UTR. El ruido ancla si se le deja sitio."
momento = "CADA_CORRIDA"
puede_degradar = true
degrada_como = "El md5 del 3'UTR y la tabla medida viven los DOS en el volumen. Lo que ningún camino de ejecución comprueba es que los VALORES de esa tabla sigan siendo los de PolyA_DB: el md5 del fichero cuadra contra el manifiesto de TRABAJO, que se escribe en el mismo volumen y se puede actualizar a la vez."
revalida = "SUITE — `tests/test_polyadb_es_un_fichero.py` y `tests/test_fraccion_medida.py` exigen que las dos fracciones sigan dando 0,86 y 0,65, pero leen la copia del REPOSITORIO."
revalida_en_produccion = "Nada, hoy. Lo cerraría un md5 del fichero de PolyA_DB fijado en CÓDIGO y no sólo en el manifiesto de trabajo — que es lo que ya se hace con la SECUENCIA canónica de las referencias, y por la misma razón: el manifiesto de trabajo es editable y la constante de `reference.REFERENCES` no."

[[guardia]]
guardia = "El `.gb` es del accession y la longitud que declara"
implementa = [
  "genbank.load_genbank_cds", "genbank.parse_plasmid_feature",
  "genbank.load_plasmid_feature", "introns._cargar_quimerico",
]
protege = "Que la anatomía —y con ella los tercios, las regiones y las distancias de polyA— salga del registro que dice ser, y que la feature extraída sea la que se pidió."
momento = "INGESTA"
puede_degradar = true
degrada_como = "El `.gb` vive en el mismo volumen que lo demás y se puede sustituir."
revalida = "El md5 del fichero, en cada corrida, por la vía del manifiesto."

[[guardia]]
guardia = "La especie de la biblioteca de RepeatMasker vive en el `.tbl`"
implementa = ["masking.check_summary", "deposito._v_rmsk"]
protege = "Que una corrida contra la biblioteca equivocada no pase por buena. Está DEMOSTRADO que los dos `.out` son el mismo fichero byte a byte: sin el resumen no hay nada que comprobar."
momento = "INGESTA"
puede_degradar = true
degrada_como = "El `.out` y el `.tbl` se suben por separado; nada impide reemplazar uno después."
revalida = "`resources._rmsk` exige el resumen y vuelve a comprobar especie y longitud de la consulta EN CADA CORRIDA."

[[guardia]]
guardia = "Lo que se sube por el panel se valida ANTES de escribirse"
implementa = ["deposito.accept_upload"]
protege = "Que un fichero que el cargador de verdad rechazaría no llegue a quedarse en el directorio ni en el manifiesto. Se escribe a un provisional, se valida, y sólo entonces se renombra."
momento = "INGESTA"
puede_degradar = false
degrada_como = "No se degrada: lo que valida es el propio cargador del filtro, y ése vuelve a correr en cada corrida."
revalida = "El cargador del filtro, en cada corrida."

[[guardia]]
guardia = "La anatomía del manifiesto cuadra con la declarada en `REFERENCES`"
implementa = ["manifest.parse_manifest"]
protege = "Que el `cds`, el `md5_secuencia` y el `md5_utr3` de una fila sean los de la referencia que dice ser. De esa frontera cuelgan los tercios, la región de cada ventana y la distancia de cada señal de polyA al extremo."
momento = "INGESTA"
puede_degradar = true
degrada_como = "Son DOS definiciones de la misma anatomía y el manifiesto de TRABAJO vive en el volumen: se puede editar sin que nada de la corrida lo compare con `REFERENCES`. `parse_manifest` sólo comprueba la FORMA —que el CDS sea `inicio..fin` creciente y que los md5 sean hexadecimales de 32—, no que coincidan."
revalida = "SUITE — `tests/test_anatomia_en_el_manifiesto.py` las cruza en las dos direcciones, sobre la copia del REPOSITORIO."
revalida_en_produccion = "Que el cargador compare la fila del manifiesto contra `reference.REFERENCES` cuando el accession esté declarado, y aborte si discrepan. Es barato —ya se lee la fila— y convierte el cruce de la suite en un guardia de corrida."

