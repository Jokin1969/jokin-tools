# ─────────────── Lo que SÓLO calcula un resumen, y por tanto no es un guardia ───────────────
#
# Aparecen en la clase derivada del código —tocan un md5— pero no COMPARAN nada: lo
# calculan para que otro lo compare, o para sembrar un generador. Se declaran aquí para
# que la clase derivada quede cubierta entera y no haya donde esconder un guardia.

[solo_calculan]
"blast.QueryFasta.md5" = "Calcula el md5 del FASTA de consulta para que `blast_store` lo compare al recibir el resultado. El guardia es aquél."
"genbank.sequence_md5" = "Calcula el md5 del ORIGIN. Quien lo compara es `reference.verify_transcript`."
"reference.sequence_md5" = "El md5 canónico de una secuencia. Lo compara `verify_transcript`."
"spliceai._md5" = "Calcula el md5 de una construcción para que `parse_result` lo compare."
"splicing.IntronlessControl.md5" = "El md5 del control sin intrón, para la hoja de pedido. No compara nada."
"store._line_md5" = "Calcula el eslabón de la cadena. Quien la comprueba es `verify()`."
"presentation.reference_md5s" = "Copia al informe los md5 del manifiesto. Es procedencia que se enseña, no una comprobación."
"gestor._md5" = "El md5 de un fichero del gestor. Lo comparan `biblioteca.guardar` y `biblioteca.leer`."
"spacers.choose_spacers" = "Usa un md5 como SEMILLA del generador de espaciadores, no como identidad: sirve para que la elección sea reproducible."
"presentation.run_fingerprint" = "Calcula la huella del panel y los ajustes. Quien la COMPARA es `cached_run`."
"controles._seed_for" = "Usa un sha256 de la guía como SEMILLA del sorteo de permutaciones, no como identidad: sirve para que la misma guía dé siempre los mismos controles, igual que `spacers.choose_spacers`. No compara nada y no hay nada que abortar."
"identidad.result_fingerprint" = "Calcula el md5 del CRUDO de una corrida. No compara nada: es la IDENTIDAD que se guarda y que entra en el `run_id`. Quien compara es `*Store.add`, que aborta si ese id ya está — y eso es lo que hace que subir dos veces el mismo fichero se rechace y repetir la corrida el mismo día no (errata nº 48). Existe en un solo sitio porque los cuatro almacenes tenían su propia copia."

# ─────────────── Comparan una identidad y NO abortan: son INFORMES ───────────────
#
# La distinción es el punto de esta auditoría: **un guardia que no aborta es un aviso, y
# un aviso no protege nada**. Lo que hay aquí compara de verdad, pero devuelve un estado
# para que alguien lo pinte. Sirve para decidir con la pantalla delante; no impide nada.

[solo_informan]
"guide_fixture.load_guide_fixture" = "COMPARA el md5, y protege el fixture de los TESTS —80 ficheros lo usan como `skipUnless`—, no ningún camino de la app. Se saca de la tabla de guardias a propósito: mezclarlo con los cargadores de producción hacía parecer que el md5 de un fichero de referencia lo comprobaba algo que sólo corre en la suite. Su justificación de alcanzabilidad ya estaba escrita y sigue valiendo."
"presentation.log_fingerprint" = "Deriva un md5 de la lista de `run_id` presentes al generar un informe, y NO impide nada: identifica el ESTADO DEL LOG con el que se genero el documento. Va en `[solo_informan]` porque su producto es una CIFRA que se compara a mano entre dos informes —misma huella, mismo documento— y no un aborto. Lo que si obliga es a que el informe la lleve: un documento que lee estado mutable y no declara contra que estado se genero no se puede comparar con otro, y la fecha no basta porque dos corridas del mismo dia son dos documentos distintos. Lo fija `tests/test_informe_contra_estado.py`, con el control de que el ORDEN de llegada no la cambia: dos logs con las mismas corridas son el mismo estado."
"manifest.check_directory" = "Compara el md5 de cada fichero del directorio contra el manifiesto y devuelve `EntryStatus.NO_COINCIDE`. Es lo que pinta el panel de ficheros — y NO aborta. Quien aborta es el cargador del filtro, en cada corrida."

# ─────────── Existen, y NO PUEDEN correr por ningun camino que haya hoy ───────────
#
# Ni guardias que alguien olvido cablear —eso es un FALLO y sale arriba— ni codigo
# muerto. Son comprobaciones escritas para una entrada que la app todavia no acepta. Se
# declaran porque la alternativa es peor: leerlas en el codigo y creer que corren.
#
# Cada una dice QUE HARIA FALTA para que corriera. Sin eso, esto seria una lista de
# excusas en vez de una lista de deudas.

[sin_camino]
"mirarchitect.Export.check_scaffold" = "Compara el LOOP del fichero contra el del andamio, que es como este proyecto dice que se decide el andamio. Necesita un EXPORT COMPLETO de miRarchitect, y el unico camino que existe —`tools/import_scores.py`— recibe un TSV de dos columnas `guia<TAB>score`, donde no hay loop. QUE HARIA FALTA: que ese CLI acepte tambien el CSV entero. Es una decision de interfaz, no un cableado, y por eso no se toma de paso. MIENTRAS TANTO el veredicto dice que el andamio se comprobo por ETIQUETA (`external_score.SCAFFOLD_BY_LABEL`)."
