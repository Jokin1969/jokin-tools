["end"]
donde = ["fragmento.FeatureDelIntron", "polya.PolyASignal", "polya.Window"]
relacion = "MISMA_MAGNITUD"
que_es = """\
Última posición, 1-based e INCLUSIVA, de lo que describe cada objeto. Las tres se \
derivan de un inicio y una longitud, y las tres son finales de intervalo — la \
convención que la errata nº 57 dejó escrita después de que `selection.Site.end` \
devolviera un INICIO con ese nombre.
En `FeatureDelIntron` el matiz que hay que leer es CUÁL intervalo: es el final de la \
FEATURE ANOTADA, que incluye contexto exónico, y NO el del intrón de GT a AG — diez \
nucleótidos más allá en el casete de este proyecto. Confundirlos es exactamente lo que \
borra exón al pegar."""

["start"]
donde = ["fragmento.FeatureDelIntron", "selection.Site"]
relacion = "DISTINTA"
que_es = """\
NO son la misma cantidad, y viven en marcos distintos. `FeatureDelIntron.start` es una \
posición sobre el PLÁSMIDO (`casete:`) y marca dónde empieza la feature anotada del \
intrón, contexto exónico incluido. `Site.start` es una posición sobre el TRANSCRITO o el \
3'UTR (`tx:` / `3utr:`) y marca dónde empieza la mejor ventana de un sitio del panel.
Que no se puedan mezclar no es una recomendación: recortar el casete con un `start` del \
panel NO da error, da otra secuencia. Es lo que caza \
`test_ningun_recorte_con_un_start_AJENO`, y por eso `FeatureDelIntron` lleva DENTRO el \
plásmido del que se derivó en vez de recibirlo como un segundo parámetro."""

["growth"]
donde = ["fragmento.Fragment", "montaje.EmittedFragment"]
relacion = "MISMA_MAGNITUD"
que_es = """\
Cuánto crece el plásmido al pegar el fragmento sobre la feature del intrón, en pares de \
bases. En `Fragment` se DERIVA (longitud del fragmento menos longitud de la feature); en \
`EmittedFragment` se LEE de la cabecera del FASTA que emitió la app. Son el mismo número \
por construcción y llegan por caminos distintos a propósito: el segundo es lo que \
declaró quien emitió, y compararlo con el plásmido montado es justo la comprobación.
Dicho de otro modo: el de `Fragment` es la fuente y el de `EmittedFragment` es la copia \
que viajó en un fichero. Por eso ese fichero lleva además el md5 de la secuencia, y \
`parse_fragments_fasta` lo recalcula antes de fiarse de ningún campo de la cabecera."""

["sequence"]
donde = ["fragmento.FeatureDelIntron", "genbank.PlasmidFeature"]
relacion = "MISMA_MAGNITUD"
que_es = """\
La secuencia que cubre una feature de un plásmido, recortada del plásmido con las \
coordenadas de la propia feature. `PlasmidFeature` la recorta de lo que se acaba de \
parsear; `FeatureDelIntron` de lo que lleva dentro. En los dos casos la coordenada y la \
secuencia salen del mismo sitio, que es la condición para que el recorte signifique \
algo."""
