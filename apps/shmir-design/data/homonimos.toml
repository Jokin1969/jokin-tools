Longitud del 3'UTR. `TilingReport` cae a la longitud de LO TILADO cuando no hay \
anatomía, que es el caso en que ese número no es un 3'UTR — y por eso lo que cuelga de \
la frontera sale `NO_FIABLE` en vez de con un valor."""

