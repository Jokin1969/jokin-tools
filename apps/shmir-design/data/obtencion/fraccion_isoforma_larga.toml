[[ficheros]]
nombre = "{fichero_polyadb}"
por_que = "LA TABLA DE PolyA_DB, y el fichero que producen los pasos de arriba. Una fila por PAS con `pas_id`, `coordenada` GENOMICA, `clase` del hexámero, `pse`, `avgrpm`, `distal` y `nota`, más una cabecera de comentarios con fuente, versión, ensamblaje, gen y el md5 del 3'UTR al que se aplica. De aquí salen la promocion de señales por MEDIDA en vez de por canonicidad y el techo de knockdown POR TRAMOS."
obligatorio = true

[[ficheros]]
nombre = "{fichero_apa}"
por_que = "OTRO FICHERO Y OTRO FORMATO, opcional: la tabla SIMPLE de tres columnas `posicion<TAB>fraccion<TAB>nombre`, con la posición YA CONVERTIDA al marco del 3'UTR y una fracción por sitio. NO es la de PolyA_DB y los pasos de arriba NO la producen: es para una medida que llega ya convertida y sin desglose por PAS — el caso de hoy sería un 3'-end seq de cerebro murino. Entra como tabla ADICIONAL (`--apa-medido`), nunca como interruptor."
obligatorio = false

