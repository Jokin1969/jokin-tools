# Ficha de obtencion — se versiona en git. Es documentacion, no un fichero de datos
# grande: se lee con `cat` y no hace falta la app para consultarla.
frente = "repeticiones"
pregunta = """\
¿La ventana cae dentro de un elemento repetitivo? Importa por dos cosas distintas: un \
tramo repetitivo dentro del casete AAV es sustrato de recombinación, y una guía contra \
un repetitivo tiene miles de sitios perfectos en el genoma."""
fuente = "RepeatMasker Web Server"
url = "https://www.repeatmasker.org/"
tamano = "unos pocos KB por corrida (el .out y el .tbl juntos no llegan a 10 KB)"
validacion = """\
La app comprueba que el `.tbl` declare la MISMA especie que se esta diseñando, y que la \
longitud de la consulta que declara el resumen (`total length:`) coincida con la de la \
secuencia cargada. Si no cuadran, se rechaza: una máscara de otra secuencia taparia un \
tramo que ahi no es repetitivo, y el intervalo cabria sin salirse de rango."""

pasos = [
  "Entra en repeatmasker.org y ve a Services → RepeatMasking.",
  "Sube el FASTA del transcrito que vas a analizar (el mismo que le das a la app).",
  "En «DNA source» elige {cientifico}. NO lo dejes en el valor por defecto: es el único sitio donde se elige la biblioteca, y con la equivocada el resultado es indistinguible de uno bueno.",
  "En «Return format» elige «tar file».",
  "En «Return method» elige «email».",
  "Del `.tar.gz` que llega por correo saca DOS ficheros: el `.out` y el `.tbl`.",
  "Renombralos a {slug} tal y como los pide la app y subelos juntos.",
]

avisos = [
  "El `.tbl` NO es opcional. Una corrida valida y una contra la biblioteca equivocada producen un `.out` INDISTINGUIBLE byte a byte cuando lo único presente es una repetición simple, porque esas se detectan por composición y no por biblioteca. Esta demostrado con datos en el propio proyecto (`masking.INDISTINGUISHABLE_OUTS`): dos ficheros con el mismo md5, uno bueno y otro con biblioteca murina sobre una consulta humana. La única diferencia vive en el `.tbl`.",
  "El `.out` NO declara la especie. Ninguno lo hace. Por eso sin resumen no hay nada que comprobar — y no haber podido comprobar no es «coincide».",
]

[[ficheros]]
nombre = "rmsk_{slug}.out"
por_que = "Las filas con los intervalos enmascarados. Es lo que se aplica a la secuencia."
obligatorio = true

[[ficheros]]
nombre = "rmsk_{slug}.tbl"
por_que = "El resumen. Es el ÚNICO sitio donde se declara la especie de la biblioteca y la longitud de la consulta, así que es lo único que permite validar la corrida. Sin el, un `.out` sin filas no distingue «no habia repetitivos» de «la corrida no llego a correr»."
obligatorio = true

[[metadatos]]
nombre = "versión de RepeatMasker"
por_que = "Sale en la cabecera del `.out` y del `.tbl`. Dos versiones dan resultados distintos sobre la misma secuencia."

[[metadatos]]
nombre = "biblioteca Dfam (con su versión)"
por_que = "RepeatMasker con Dfam_3.0 y con otra biblioteca dan resultados distintos, así que la versión del binario a solas NO identifica la corrida. Va en su propia columna del manifiesto."
