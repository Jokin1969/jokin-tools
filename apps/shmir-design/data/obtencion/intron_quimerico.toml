frente = "intron_quimerico"
pregunta = """\
¿Como se comporta el módulo dentro de OTRO intrón? El cuarto modal pregunta sobre el \
cassette montado, no sobre la guía, así que el intrón es la mitad de la pregunta. Con uno \
solo no hay con que comparar: un perfil «limpio» en el MVM no dice si el módulo es \
limpio o si el MVM es tolerante."""
fuente = "Un plásmido comercial del laboratorio que lo lleve (familia pAAV-MCS y equivalentes)"
url = "—"
tamano = "unos KB (el intrón son cientos de nt; el plásmido entero, unos 5-7 kb)"
validacion = """\
Al cargarlo la app LOCALIZA los cuatro elementos por secuencia y los declara: donante \
(GT del principio), aceptor (AG del final), tracto de polipirimidinas contiguas aguas \
arriba del aceptor, y los candidatos a punto de ramificacion (motivo YURAY entre 18 y 40 \
nt aguas arriba). Si no empieza por GT o no acaba en AG, se RECHAZA: o no es un intrón o \
no empieza donde se cree, y las dos cosas invalidan todas las coordenadas. Además se \
comprueba el suelo de 80 nt con el módulo dentro."""

pasos = [
