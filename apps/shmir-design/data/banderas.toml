# Banderas de los CLI: cuáles se recorren de PUNTA A PUNTA en algún test.
#
# Lo escribe a mano una persona; la LISTA de banderas la deriva
# `tools/auditar_banderas.py` de los `add_argument` de cada CLI, y el recorrido lo deriva
# de los tests. Aquí sólo vive lo que no se puede derivar: QUÉ CONSECUENCIA tiene cada
# bandera, que es lo que ordena la lista.
#
# El criterio, declarado y no citado:
#
#   VEREDICTO  — puede cambiar si un candidato pasa, cae o queda INCOMPLETE: conecta un
#                filtro o un frente, mueve un umbral o una regla de selección, resuelve
#                la anatomía, o ABORTA cuando un md5 no cuadra. Sin recorrido de punta a
#                punta, un fallo aquí manda a síntesis lo que no es.
#   DATO       — mete o mueve cifras y anotaciones que VIAJAN con el veredicto sin
#                decidirlo: versiones, nombres, notas, ponderaciones que no vetan.
#   FORMATO    — cambia qué se emite o cómo, no lo que se decide.
#   FONTANERIA — rutas, nombres y directorios. Un fallo aquí se ve en el acto.
#
# Un `*-md5` es VEREDICTO y no DATO a propósito: su trabajo es ABORTAR cuando el fichero
# no es el que dice ser. Si ese camino no se recorre nunca, el fichero equivocado entra
# en silencio — que es exactamente la clase de fallo que este proyecto lleva registrada.

