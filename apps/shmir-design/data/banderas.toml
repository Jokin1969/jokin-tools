# ── EL TRINQUETE ──────────────────────────────────────────────────────────────
#
# Una lista larga se lee como «pendiente» y no obliga a nada (principio nº 15). Esto es
# lo que la convierte en algo que hay que tocar: el número de banderas VEREDICTO sin
# recorrido de punta a punta va DECLARADO, y `tests/test_banderas.py` falla en las DOS
# direcciones — si sube, alguien añadió una bandera que decide y no la recorrió; si baja,
# el techo está caducado y hay que bajarlo aquí.
#
# Sólo puede ir hacia abajo. No hace falta cubrirlas todas de golpe: hace falta que
# bajarlo sea la única forma de cerrar la suite.
#
# HISTORIA, porque el camino importa tanto como el número:
#   54 → 52  dos exenciones declaradas (las de red, regla 4)
#   52 → 50  `--mirbase` recorrida entera
#   50 → 41  NUEVE banderas RETIRADAS. Bajar eliminando es más barato que cubrir, y una
#            bandera retirada no puede fallar. De las nueve, cinco reproducían una
#            decisión ya tomada y cuatro estaban muertas — y una de las cinco,
#            `--inmunes`, llevaba puesto un defecto (0) que contradice la constante del
#            proyecto (4) y hacía que el CLI diera un panel distinto del de la página.
[umbral]
veredicto_sin_recorrer = 41

# ── COMBINACIONES que sólo significan algo juntas ─────────────────────────────
#
# argparse no las expresa: `--rmsk` a solas ABORTA a propósito, así que las tres por
# separado no dicen nada del camino. Van declaradas, y el test comprueba que cada
# bandera nombrada existe de verdad.

[[combinacion]]
cli = "design"
banderas = ["--rmsk", "--rmsk-resumen", "--rmsk-especie", "--rmsk-version"]
por_que = "la máscara sólo se valida con su resumen y su especie; el `.out` a solas aborta"

[[combinacion]]
cli = "design"
banderas = ["--apa-medido", "--apa-version", "--apa-coords"]
por_que = "la tabla medida sin marco de coordenadas anclaría ruido"

[[combinacion]]
