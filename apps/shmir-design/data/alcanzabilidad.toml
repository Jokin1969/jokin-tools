#   2. LEGÍTIMAS — se llaman desde fuera de Python, son herramienta de los tests, o
#      existen para NEGARSE. Van justificadas abajo y desaparecen del informe.
#   3. MUERTAS — un atajo más estrecho de algo que ya se usa entero. Se borran en su
#      propia tanda, con su diff: borrar código en la misma tanda que arregla otra cosa
#      esconde el borrado dentro de un diff que se lee por otro motivo.
#
