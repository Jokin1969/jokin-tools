#   · can_transfer (transfer) — la forma simple sobre un conjunto de posiciones.
#     `can_transfer_window`, que recibe el alineamiento, es la que distingue lo ambiguo
#     de lo cierto; pero OJO: tampoco ella tiene llamador, así que las dos se revisan
#     JUNTAS y no se borra una dejando la otra colgando.


