# ── EL TRINQUETE ──────────────────────────────────────────────────────────────
#
# Cuenta los estados que DECIDEN qué se pinta, no están bloqueados por una razón escrita,
# y en los que nadie ha pintado la página. Falla en las DOS direcciones, como el de las
# banderas: sólo puede ir hacia abajo.
#
# LOS BLOQUEADOS CUENTAN. Excluirlos dejaba el número en CERO con diecinueve estados sin
# pintar — un informe que se lee como «pendiente» y no obliga a nada (principio nº 15).
# `bloqueado_por` dice POR QUÉ no se puede hoy; no exime de contarlo.
#
# HOY ESTÁ EN 10 sobre 29. Estaba en 19, y las causas eran DOS, no diecinueve. Se abrió
# la segunda —`SHMIR_REFERENCE_DIR` se lee en cada llamada, así que un test puede apuntar
# la página a un depósito de prueba— y con ella cayeron los NUEVE estados de fichero de
# golpe: `tests/test_estados_de_fichero.py` pinta la página con el depósito vacío y con
# el completo. Eso es lo que quería decir «la causa es una»: no hacían falta nueve tests.
#
# Y al pintarlos apareció lo que ninguna suite veía: una fila COLAPSADA Y AUSENTE
# —`apa_medido.tsv`, cuyo frente ya cierra PolyA_DB— salía con las cuatro acciones de un
# fichero presente. El panel enseñaba un error rojo al abrir la app y «Ver» tiraba la
# página entera. Errata nº 34.
#
# Y EL 2026-08-30 ESE BLOQUEO SE COBRO UNO: `NameError: _modal_blast` en produccion, al
# pulsar Disenar, en el estado DISENADO_CON_SELECCION — el que esta tabla decia sin pintar.
# El inventario acerto. Lo que enseño el fallo es otra cosa: NO HACIA FALTA pintarlo. La
# llamada a `main()` estaba a mitad del fichero con los cuatro modales definidos debajo, y
# eso se ve con un `ast.parse` de veinte lineas, sin Streamlit y sin ejecutar nada
# (errata nº 36). UN BLOQUEO DECLARADO INVITA A DEJAR DE BUSCAR POR OTRO LADO: la
# explicacion de por que no se puede hacer lo caro ocupo el sitio de la pregunta de si
# habia algo barato. A cada `bloqueado_por` le falta esa pregunta al lado.
#
# LOS DIEZ QUE QUEDAN son todos la MISMA causa: `AppTest` no puede rellenar un
# `file_uploader`, así que la página no llega a DISEÑADO — y con ella se quedan fuera los
# ocho de los cuatro modales. Es un límite de la herramienta, no de la app, así que
# cerrarlo pide un rodeo: una vía para inyectar la secuencia sin pasar por el widget.
[umbral]
sin_pintar = 11
# ─── El eje del RERUN y el del PROYECTO. AÑADIDOS (2026-09-01), errata nº 42 ─────────
#
# Los 29 estados de antes describian TODOS la pagina recien pintada. En Streamlit cada
# tecla que el usuario escribe es un rerun, asi que el segundo render no es un caso raro:
# es el normal — y ahi vivia el fallo que dejo el formulario de guardar imposible de
# completar. El inventario no podia verlo porque el eje no existia.

[[estado]]
estado = "rerun:PRIMERA"
destino = "CUBRIR"
que_pinta = "La pagina recien cargada. Es lo que pintaban los 29 estados anteriores, todos."

[[estado]]
estado = "rerun:SEGUNDA"
destino = "CUBRIR"
que_pinta = "La pagina DESPUES de tocar un widget. Aqui es donde se cae lo que colgaba de un booleano de un solo rerun — un boton pulsado, una corrida cacheada sin huella."

[[estado]]
estado = "proyecto:SIN_ABRIR"
destino = "CUBRIR"
que_pinta = "Los modales calculan y no ofrecen guardar. Es el estado de toda corrida de `AppTest` de hoy."

[[estado]]
estado = "proyecto:ABIERTO"
destino = "CUBRIR"
que_pinta = "El cartel del proyecto en la barra lateral, el historial, y en cada modal el formulario de «Guardar en el proyecto» con fecha y quien la corrio. De este estado cuelga si una corrida se puede guardar, que es para lo que existe la persistencia."
bloqueado_por = "El panel de proyecto se pinta DESPUES de diseñar, y `AppTest` no rellena un `file_uploader`. Lo cerraría la misma vía que los otros diez: inyectar la secuencia sin pasar por el widget. Es el mismo bloqueo, no uno nuevo."
# ─── El eje de la ESPECIE. AÑADIDO (2026-09-08), D2 de la revisión previa al humano ──
#
# Los 35 estados de antes modelaban `corrida`, `fichero:<rol>`, `modal:<corrida>`,
# `proyecto` y `rerun`, y ninguno la ESPECIE: los describían TODOS sobre una corrida de
# ratón. Es la contrapartida del principio nº 15 que ya se aprendió con el eje de
# proyecto —un inventario que no puede expresar un estado no puede echarlo de menos— y
# aquí pesa más, porque de la especie cuelgan los NOMBRES de todos los ficheros del
# depósito, que es exactamente lo que se acababa de arreglar en la errata nº 157.
#
# Y ESTE EJE NO ESTÁ BLOQUEADO, que es lo que lo separa de los otros once: elegir la
# especie es `selectbox.set_value(...)` y no hace falta ningún `file_uploader`. Los
# cuatro valores se pintan hoy, así que el trinquete NO sube.
#
# MEDIDO al pintarlos (`tests/test_estados_de_especie.py`): sin elegir 5 bloques y cero
# huecos de subida; `mouse` 16 y CUATRO; `human` 19 y SIETE; no declarada 5, cero y el
# aviso de cómo se declara. Los tres huecos de más del humano son `aav_casete_human.fa`,
# `polya_db_human.tsv` y `apa_medido_human.tsv`.

[[estado]]
estado = "especie:mouse"
destino = "CUBRIR"
que_pinta = "El gestor con los nombres MURINOS: cuatro huecos de subida, `rmsk_mouse.out`, `mature.fa`, `aav_casete.fa` y `polya_db_mouse.tsv` en verde, y `apa_medido.tsv` como NO USADO —su frente ya lo cierra PolyA_DB—. Es la especie de todas las corridas de `AppTest` anteriores a este eje."

[[estado]]
estado = "especie:human"
destino = "CUBRIR"
que_pinta = "El mismo gestor con los nombres HUMANOS: SIETE huecos, tres de ellos que el ratón no tiene —`aav_casete_human.fa`, `polya_db_human.tsv` y `apa_medido_human.tsv`—. Y `apa_medido` cambia de estado con la especie: NO USADO en ratón, FALTA en humano, sin que nada más cambie."

[[estado]]
estado = "especie:NO_DECLARADA"
destino = "CUBRIR"
que_pinta = "La opción explícita del desplegable: el aviso de que esa especie se queda sin prefijo de miRBase, sin taxid y sin ensamblaje, los frentes que quedan cerrados uno a uno, y CÓMO se declara (`species.SPECIES`). No ofrece ningún hueco de subida — los nombres dependen de la especie y aquí no hay ninguna."

[[estado]]
estado = "especie:SIN_ELEGIR"
destino = "CUBRIR"
que_pinta = "Lo que ve quien abre la app: el desplegable SIN valor —`species_default()` devuelve `None` a propósito— y la página sin llegar al gestor, diciendo por qué. Un valor inicial parecía configurado y dejaba la colisión de seed y la especificidad rotas sin decir nada."
