# ── EL TRINQUETE ──────────────────────────────────────────────────────────────
#
# Cuenta los estados que DECIDEN qué se pinta, no están bloqueados por una razón escrita,
# y en los que nadie ha pintado la página. Falla en las DOS direcciones, como el de las
# banderas: sólo puede ir hacia abajo.
#
# LOS BLOQUEADOS CUENTAN. Excluirlos dejaba el número en CERO con diecinueve estados sin
# pintar — un informe que se lee como «pendiente» y no obliga a nada (principio nº 15).
# `bloqueado_por` dice POR QUÉ no se puede hoy; no exime de contarlo.
#
# HOY ESTÁ EN 10 sobre 29. Estaba en 19, y las causas eran DOS, no diecinueve. Se abrió
# la segunda —`SHMIR_REFERENCE_DIR` se lee en cada llamada, así que un test puede apuntar
# la página a un depósito de prueba— y con ella cayeron los NUEVE estados de fichero de
# golpe: `tests/test_estados_de_fichero.py` pinta la página con el depósito vacío y con
# el completo. Eso es lo que quería decir «la causa es una»: no hacían falta nueve tests.
#
# Y al pintarlos apareció lo que ninguna suite veía: una fila COLAPSADA Y AUSENTE
# —`apa_medido.tsv`, cuyo frente ya cierra PolyA_DB— salía con las cuatro acciones de un
# fichero presente. El panel enseñaba un error rojo al abrir la app y «Ver» tiraba la
# página entera. Errata nº 34.
#
# LOS DIEZ QUE QUEDAN son todos la MISMA causa: `AppTest` no puede rellenar un
# `file_uploader`, así que la página no llega a DISEÑADO — y con ella se quedan fuera los
# ocho de los cuatro modales. Es un límite de la herramienta, no de la app, así que
# cerrarlo pide un rodeo: una vía para inyectar la secuencia sin pasar por el widget.
[umbral]
sin_pintar = 10