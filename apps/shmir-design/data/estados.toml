# Estados de la interfaz: en cuáles se ha PINTADO la página alguna vez.
#
# El espacio lo deriva `tools/auditar_estados.py` —los roles de `species.required_files`,
# los modales de `store.RECORD_KINDS`— y el nivel lo deriva de los tests. Aquí sólo vive
# lo que no se puede derivar: QUÉ PINTA cada estado y qué se hace con él.
#
# Los tres destinos, los mismos que en las banderas:
#
#   CUBRIR    — pinta algo distinto y hay que probarlo pintando.
#   CONSTANTE — el estado existe pero la página pinta lo mismo que en otro: no es un
#               estado propio y debería dejar de contarse como tal.
#   BORRAR    — la página no puede estar en él.
#
# Y `bloqueado_por` dice por qué no se puede cubrir HOY. No es una excusa: es la tarea
# concreta que lo desbloquearía, como `revalida_en_produccion` en los guardias.

[[estado]]
estado = "corrida:SIN_DISEÑAR"
destino = "CUBRIR"
que_pinta = "Pasos 1-4, sin resultados y sin paso 5. Es lo que ve quien abre la app."

[[estado]]
estado = "corrida:DISEÑADO_SIN_SELECCION"
destino = "CUBRIR"
que_pinta = "Aparecen resultados, mapa, semáforo y el paso 5 con el panel de refinamiento."
bloqueado_por = "`AppTest` no puede rellenar un `file_uploader`, así que ningún test puede llevar la página al estado DISEÑADO. Lo cerraría una vía para inyectar la secuencia sin pasar por el widget."

[[estado]]
