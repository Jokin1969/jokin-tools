# Menciones del prefijo del marco —`3utr:`, `tx:`— que NO fabrican ninguna etiqueta.
#
# La lista de literales la deriva `tools/auditar_marcos.py`; aquí sólo vive lo que no se
# puede derivar: por qué esa mención es prosa y no un emisor.
#
# La diferencia es mecánica y la aplica el propio auditor: un literal que TERMINA en el
# prefijo fabrica una etiqueta con lo que venga detrás, y eso no se declara — se arregla,
# pidiéndosela a `coords`. Un literal que lleva el número DENTRO nombra un caso concreto:
# «`3utr:221` era uno de los cuatro inmunes» explica algo, no etiqueta nada.
#
# Que la prosa también se declare no es celo: es que un número escrito a mano en prosa
# CADUCA —principio nº 11— y esta tabla es la lista de los que hay que volver a mirar
# cuando cambie la anatomía, la referencia o el panel. Una entrada que ya no corresponde
# a ningún literal ABORTA, por lo mismo que en las otras tablas: una lista con entradas
# muertas deja de leerse.

