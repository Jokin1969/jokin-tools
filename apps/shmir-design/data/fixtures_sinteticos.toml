# Tests que FABRICAN un artefacto que existe de verdad en `data/reference/`.
#
# La lista la deriva `tools/auditar_fixtures.py`; aquí sólo vive lo que no se puede
# derivar: POR QUÉ ese test no usa el real.
#
# Fabricar no está prohibido —probar el caso malo, la cabecera corta, un md5 que no
# cuadra o un fichero de 5,6 MB que no hace falta son motivos buenos—. Lo que no vale es
# no decirlo: un fixture sintético donde existe el real valida un camino que nadie
# recorre, que es la segunda mitad del principio nº 18.
#
# `usa_el_real = true` es para el caso en que alguien cablee el real y la entrada se
# quede: entonces la justificación caduca y el test lo dice.

[[fixture]]
test = "test_directorio_trabajo.py"
artefacto = "NM_011170.3.fa"
usa_el_real = false
por_que_no_el_real = "La siembra tiene que comprobar que NO PISA lo ya subido, y para eso el fichero de destino tiene que ser DISTINTO del versionado: se escribe «MIO» y se exige que siga ahí después de sembrar. Con el real, un fichero idéntico no distinguiría «no lo pisó» de «lo pisó con lo mismo»."

