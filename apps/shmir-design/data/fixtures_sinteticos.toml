por_que_no_el_real = "El real son 5,6 MB y aquí sólo se prueban las CUATRO ACCIONES del gestor —ver, reemplazar, borrar, descargar—, que no miran el contenido. Copiarlo en cada uno de los tests de este fichero multiplicaría el tiempo de la suite sin comprobar nada más."

